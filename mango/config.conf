################################################################################
# AUTOSTART
################################################################################
exec_once=dunst
exec_once=nm-applet
exec_once=blueman-applet
exec_once=waybar

################################################################################
# STYLE
################################################################################
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=8
gap_outer_vertical=8

# Border
border_px=2
border_radius=5
shadows=0
unfocused_opacity=0.6
blur=1
blur_optimized=1

################################################################################
# LAYOUT
################################################################################
new_is_master=1
default_master_factor=0.55
default_master_count=1
circle_layout=tile,monocle,deck
tag_num=10

################################################################################
# INPUT
################################################################################
xkb_rules_layout=us,se,br
xkb_rules_options=ctrl:nocaps,grp:win_space_toggle

################################################################################
# WINDOW RULES
################################################################################
# Spotify on tag 9, without stealing focus
window_rule=tags:9,is_tag_silent:1,app_id:spotify

################################################################################
# KEYBINDINGS
################################################################################
# Main modifier: ALT
# Applications
bind=ALT+SHIFT,Return,spawn,alacritty
bind=ALT+SHIFT,L,spawn,hyprlock
bind=ALT,P,spawn,wofi --show run
bind=ALT+SHIFT,P,spawn,wofi --show run --matching fuzzy
bind=ALT,S,spawn,flameshot
bind=ALT,E,spawn,pcmanfm ~

# Window actions
bind=ALT,Q,killclient
bind=ALT+SHIFT,Q,quit
bind=ALT,F,togglefloating
bind=ALT,T,setlayout,tile
bind=ALT,M,setlayout,monocle
bind=ALT+SHIFT,D,setlayout,deck
bind=ALT,TAB,switch_layout

# Focus monitors
bind=ALT,comma,focusmon,left
bind=ALT,period,focusmon,right

# Focus windows
bind=ALT,J,focusstack,next
bind=ALT,K,focusstack,prev

# Master-stack controls
bind=ALT,Return,zoom
bind=ALT,D,incnmaster,+1
bind=ALT,I,incnmaster,-1

# Move windows between monitors
bind=ALT+SHIFT,comma,tagmon,left
bind=ALT+SHIFT,period,tagmon,right

# Resize: use MangoWC's floating-window resize dispatcher.
# Tiled-window size is controlled by master factor.
bind=ALT,H,setmfact,-0.05
bind=ALT,L,setmfact,+0.05

# Workspaces / tags 1-9
bind=ALT,1,view,1
bind=ALT,2,view,2
bind=ALT,3,view,3
bind=ALT,4,view,4
bind=ALT,5,view,5
bind=ALT,6,view,6
bind=ALT,7,view,7
bind=ALT,8,view,8
bind=ALT,9,view,9
bind=ALT,0,view,10

# Move windows to tags 1-9
bind=ALT+SHIFT,1,tag,1
bind=ALT+SHIFT,2,tag,2
bind=ALT+SHIFT,3,tag,3
bind=ALT+SHIFT,4,tag,4
bind=ALT+SHIFT,5,tag,5
bind=ALT+SHIFT,6,tag,6
bind=ALT+SHIFT,7,tag,7
bind=ALT+SHIFT,8,tag,8
bind=ALT+SHIFT,9,tag,9
bind=ALT+SHIFT,0,tag,10

################################################################################
# MULTIMEDIA
################################################################################
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bind=NONE,XF86AudioNext,spawn,playerctl next
# bind=NONE,XF86AudioPause,spawn,playerctl play-pause
# bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous

################################################################################
# MOUSE
################################################################################
# Alt + left click to move; Alt + right click to resize
mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize
